name: Feature request
description: Suggest a change or addition.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you write: this project deliberately stays a **private, client-side, static** questionnaire with **no backend, no accounts, no analytics and no persistence**. Requests that would add a server, store answers, track users or turn the index into a clinical risk calculator are out of scope and will be closed. Everything else is fair game.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require a backend, database or user accounts.
          required: true
        - label: This does not send, store or track any user answers.
          required: true
        - label: This does not present the score as a validated clinical or diagnostic result.
          required: true
